<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGroom Pro - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1efea;
            background-image: url("https://www.transparenttextures.com/patterns/paw-print.png");
        }
        .sidebar { background-color: #d2b48c; }
        .card-green { background-color: #7d9d85; }
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hover-lift { transition: all 0.3s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        /* Shimmer effect for loading */
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="flex min-h-screen overflow-x-hidden">

    <aside class="w-20 md:w-64 sidebar text-amber-900 shadow-xl flex flex-col items-center py-8 z-20">
        <div class="mb-10 text-center animate__animated animate__bounceIn">
            <div class="bg-white p-3 rounded-full shadow-lg inline-block">
                <i class="fas fa-dog text-3xl text-amber-700"></i>
            </div>
            <h1 class="hidden md:block mt-4 font-bold text-xl tracking-wider uppercase">PetGroom Pro</h1>
        </div>
        <nav class="flex-1 w-full px-4 space-y-4">
            <a href="#" class="flex items-center justify-center md:justify-start p-3 rounded-xl bg-white/50 text-amber-900 font-bold transition-all">
                <i class="fas fa-th-large md:mr-4 text-xl"></i>
                <span class="hidden md:block">Dashboard</span>
            </a>
            <a href="#" class="flex items-center justify-center md:justify-start p-3 rounded-xl hover:bg-white/30 text-amber-800 transition-all">
                <i class="fas fa-paw md:mr-4 text-xl"></i>
                <span class="hidden md:block">Pets</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10 relative">
        <header class="flex justify-between items-center mb-10 animate__animated animate__fadeIn">
            <div>
                <h2 class="text-3xl font-bold text-amber-900">Live Reservations 🐾</h2>
                <p class="text-green-700" id="last-updated">Fetching live data...</p>
            </div>
            <button onclick="fetchData()" class="bg-green-700 text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:bg-green-800 transition-all transform hover:rotate-2">
                <i class="fas fa-sync-alt mr-2"></i> Refresh Data
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
            <div class="card-green p-6 rounded-3xl text-white shadow-lg hover-lift animate__animated animate__fadeInLeft">
                <p class="text-sm opacity-80 uppercase tracking-widest">Total Orders</p>
                <h3 class="text-4xl font-bold mt-2" id="stat-total">-</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl text-amber-900 shadow-lg hover-lift animate__animated animate__fadeInLeft border-b-4 border-green-600">
                <p class="text-sm opacity-60 uppercase tracking-widest">Estimated Revenue</p>
                <h3 class="text-3xl font-bold mt-2 text-green-700" id="stat-revenue">Rp 0</h3>
            </div>
            <div class="bg-amber-100 p-6 rounded-3xl text-amber-900 shadow-lg border border-amber-200 hover-lift animate__animated animate__fadeInLeft">
                <p class="text-sm opacity-80 uppercase tracking-widest text-amber-700">Small Pets Count</p>
                <h3 class="text-4xl font-bold mt-2" id="stat-small">-</h3>
            </div>
        </div>

        <div class="glass rounded-[2rem] p-6 shadow-2xl animate__animated animate__fadeInUp overflow-hidden">
            <div class="overflow-x-auto max-h-[500px] custom-scrollbar">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-[#f8f6f2] z-10">
                        <tr class="text-amber-800 border-b border-amber-200">
                            <th class="pb-4 font-bold px-2">ID</th>
                            <th class="pb-4 font-bold px-2">Customer</th>
                            <th class="pb-4 font-bold px-2">Pet (Size)</th>
                            <th class="pb-4 font-bold px-2">Service</th>
                            <th class="pb-4 font-bold px-2 text-right">Price</th>
                            <th class="pb-4 font-bold px-2 text-center">Status</th>
                            <th class="pb-4 font-bold px-2">Date</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-amber-900 divide-y divide-amber-100">
                        <tr>
                            <td colspan="7" class="py-10 text-center text-amber-600 animate-pulse">Loading data from Railway...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://n8n-production-bdac.up.railway.app/webhook/55218dcf-9a04-45e6-b2ac-1fea1528c08d';

        async function fetchData() {
            const tbody = document.getElementById('table-body');
            const lastUpdated = document.getElementById('last-updated');
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Reset table
                tbody.innerHTML = '';
                
                let totalRevenue = 0;
                let smallCount = 0;

                data.forEach((item, index) => {
                    totalRevenue += parseFloat(item.price);
                    if(item.size === 'Small') smallCount++;

                    const row = `
                        <tr class="hover:bg-white/60 transition-colors animate__animated animate__fadeIn" style="animation-delay: ${index * 0.05}s">
                            <td class="py-4 px-2 font-bold text-amber-700">${item.id}</td>
                            <td class="py-4 px-2 font-semibold">${item.customer_name}</td>
                            <td class="py-4 px-2">
                                <div class="flex flex-col">
                                    <span class="flex items-center"><i class="fas fa-paw mr-2 text-xs text-amber-500"></i>${item.pet_name}</span>
                                    <span class="text-[10px] bg-amber-100 text-amber-700 px-2 rounded-full w-max mt-1">${item.size}</span>
                                </div>
                            </td>
                            <td class="py-4 px-2 text-sm">${item.service_name}</td>
                            <td class="py-4 px-2 text-right font-bold text-green-700">${formatCurrency(item.price)}</td>
                            <td class="py-4 px-2 text-center">
                                <span class="bg-amber-400 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-sm uppercase shadow-amber-200">
                                    ${item.status}
                                </span>
                            </td>
                            <td class="py-4 px-2 text-[11px] opacity-70">${formatDate(item.start_date)}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                // Update Stats
                document.getElementById('stat-total').innerText = data.length;
                document.getElementById('stat-revenue').innerText = formatCurrency(totalRevenue);
                document.getElementById('stat-small').innerText = smallCount;
                lastUpdated.innerText = "Last updated: " + new Date().toLocaleTimeString();

            } catch (error) {
                console.error('Error fetching data:', error);
                tbody.innerHTML = '<tr><td colspan="7" class="py-10 text-center text-red-500">Failed to load data. Make sure CORS is enabled on n8n.</td></tr>';
            }
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function formatDate(dateString) {
            const options = { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        // Auto Load
        window.onload = fetchData;
    </script>
</body>
</html>
