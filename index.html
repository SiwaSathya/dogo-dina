<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGroom Pro - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f6f0;
        }
        .sidebar { background-color: #d9c5b2; }
        .bg-card-green { background-color: #8fa88a; }
        .bg-card-yellow { background-color: #f9f0c1; }
        .status-pending { background-color: #ffcc80; color: #7a5100; }
        .status-completed { background-color: #a5d6a7; color: #1b5e20; }
        .status-cancelled { background-color: #ef9a9a; color: #b71c1c; }
        
        .custom-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .table-row-hover:hover { background-color: #fafafa; transition: 0.2s; }
        
        .btn-pagination {
            transition: all 0.2s;
            border: 1px solid #e5e1d8;
        }
        .btn-pagination:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-pagination:not(:disabled):hover {
            background-color: #8fa88a;
            color: white;
            border-color: #8fa88a;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 sidebar flex flex-col p-6">
        <div class="flex flex-col items-center mb-10">
            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center mb-3 shadow-sm">
                <i class="fas fa-paw text-[#8d735b] text-xl"></i>
            </div>
            <h2 class="text-amber-900 font-bold tracking-wider text-lg">PETGROOM PRO</h2>
        </div>
        <nav class="space-y-2 flex-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-white/50 rounded-2xl text-amber-900 font-semibold shadow-sm">
                <i class="fas fa-th-large w-5"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-amber-900/70 hover:bg-white/30 rounded-2xl transition">
                <i class="fas fa-dog w-5"></i> Pets
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-amber-900/70 hover:bg-white/30 rounded-2xl transition">
                <i class="fas fa-calendar-alt w-5"></i> Schedules
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-amber-900/70 hover:bg-white/30 rounded-2xl transition">
                <i class="fas fa-cog w-5"></i> Settings
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div class="flex justify-between items-start mb-10">
            <div>
                <h1 class="text-3xl font-bold text-amber-950">Welcome Back, Admin! 🐾</h1>
                <p class="text-green-700 font-medium mt-1">Here's what's happening today.</p>
            </div>
            <button class="bg-[#1a8a4d] text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-lg hover:scale-105 transition-transform">
                + New Reservation <span class="text-xs opacity-70">✨</span>
            </button>
        </div>

        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-12 lg:col-span-3 space-y-6">
                <div class="bg-card-green p-6 rounded-[32px] text-white relative h-32 flex flex-col justify-between shadow-sm">
                    <p class="text-xs font-bold uppercase tracking-widest opacity-80">Active Appointments</p>
                    <div class="flex justify-between items-end">
                        <span class="text-3xl font-bold" id="stat-active">-</span>
                        <i class="fas fa-calendar-check text-xl opacity-40"></i>
                    </div>
                </div>
                
                <div class="bg-card-yellow p-6 rounded-[32px] text-amber-900 relative h-32 flex flex-col justify-between shadow-sm">
                    <p class="text-xs font-bold uppercase tracking-widest opacity-60">Total Pets</p>
                    <div class="flex justify-between items-end">
                        <span class="text-3xl font-bold" id="stat-total">-</span>
                        <i class="fas fa-dog text-xl opacity-20"></i>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-[32px] text-amber-950 border-b-4 border-green-500 h-32 flex flex-col justify-between custom-shadow">
                    <p class="text-xs font-bold uppercase tracking-widest opacity-40">Total Revenue</p>
                    <span class="text-2xl font-bold text-green-700" id="stat-revenue">Rp 0</span>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-9 bg-white rounded-[40px] p-8 custom-shadow flex flex-col">
                <div class="flex-1 min-h-[480px]">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-amber-900/40 text-sm font-bold uppercase tracking-tighter border-b border-amber-50">
                                <th class="pb-6 w-12 text-center">ID</th>
                                <th class="pb-6">Customer</th>
                                <th class="pb-6">Pet</th>
                                <th class="pb-6">Service</th>
                                <th class="pb-6">Status</th>
                                <th class="pb-6">Date</th>
                            </tr>
                        </thead>
                        <tbody id="api-table-body" class="text-[#5d4037] font-medium">
                            </tbody>
                    </table>
                </div>

                <div class="mt-8 pt-6 border-t border-amber-50 flex items-center justify-between">
                    <p class="text-sm text-amber-900/40">
                        Showing <span id="page-range" class="font-bold text-amber-900">0 - 0</span> of <span id="total-data" class="font-bold text-amber-900">0</span>
                    </p>
                    <div class="flex gap-2">
                        <button id="prev-btn" onclick="changePage(-1)" class="btn-pagination w-10 h-10 rounded-xl flex items-center justify-center text-amber-900">
                            <i class="fas fa-chevron-left text-xs"></i>
                        </button>
                        <div id="page-numbers" class="flex gap-2">
                            </div>
                        <button id="next-btn" onclick="changePage(1)" class="btn-pagination w-10 h-10 rounded-xl flex items-center justify-center text-amber-900">
                            <i class="fas fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://n8n-production-bdac.up.railway.app/webhook/55218dcf-9a04-45e6-b2ac-1fea1528c08d';
        
        let allData = [];
        let currentPage = 1;
        const rowsPerPage = 6;

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                allData = await res.json();
                
                updateStats();
                renderTable();
            } catch (err) {
                console.error("API Error:", err);
                document.getElementById('api-table-body').innerHTML = `<tr><td colspan="6" class="text-center py-10 text-red-400">Error loading data.</td></tr>`;
            }
        }

        function updateStats() {
            let active = 0;
            let revenue = 0;
            
            allData.forEach(item => {
                if(item.status.toLowerCase() === 'pending') active++;
                revenue += parseFloat(item.price || 0);
            });

            document.getElementById('stat-active').innerText = active;
            document.getElementById('stat-total').innerText = allData.length;
            document.getElementById('stat-revenue').innerText = formatToM(revenue);
            document.getElementById('total-data').innerText = allData.length;
        }

        function renderTable() {
            const tbody = document.getElementById('api-table-body');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = allData.slice(start, end);

            paginatedItems.forEach((item) => {
                const statusClass = `status-${item.status.toLowerCase()}`;
                const row = `
                    <tr class="table-row-hover border-b border-amber-50/50 last:border-0">
                        <td class="py-4 text-center text-amber-900/30 font-bold">${item.id}</td>
                        <td class="py-4 font-bold text-amber-900">${item.customer_name}</td>
                        <td class="py-4">
                            <span class="flex items-center gap-2">
                                <span class="text-amber-800 opacity-20 italic font-normal text-[10px]">▢</span> ${item.pet_name}
                            </span>
                        </td>
                        <td class="py-4 text-sm opacity-80">${item.service_name}</td>
                        <td class="py-4">
                            <span class="px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest ${statusClass}">
                                ${item.status}
                            </span>
                        </td>
                        <td class="py-4 text-xs text-amber-900/60 font-mono">
                            ${formatDate(item.start_date)}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            updatePaginationControls(start, end);
        }

        function updatePaginationControls(start, end) {
            const totalPages = Math.ceil(allData.length / rowsPerPage);
            const actualEnd = end > allData.length ? allData.length : end;
            
            document.getElementById('page-range').innerText = `${allData.length === 0 ? 0 : start + 1} - ${actualEnd}`;
            
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages || totalPages === 0;

            // Optional: Render page numbers
            const pageNumbers = document.getElementById('page-numbers');
            pageNumbers.innerHTML = '';
            
            // Show current page indicator
            pageNumbers.innerHTML = `<span class="w-10 h-10 rounded-xl bg-amber-50 text-amber-900 flex items-center justify-center font-bold text-sm border border-amber-100">${currentPage}</span>`;
        }

        function changePage(direction) {
            currentPage += direction;
            renderTable();
        }

        function formatDate(dateStr) {
            if(!dateStr) return "-";
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function formatToM(value) {
            const millions = value / 1000000;
            return millions >= 1 ? `Rp ${millions.toFixed(1)}M` : `Rp ${value.toLocaleString('id-ID')}`;
        }

        // Run
        fetchData();
        // Refresh data every 2 minutes to keep it fresh without disrupting user pagination often
        setInterval(fetchData, 120000);
    </script>
</body>
</html>
